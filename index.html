<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="heading">
      <button id="againbtn">Again!</button>
      <p>Between 1 to 20</p>
    </div>

    <h1 class="centre">Guess My Number!!</h1>

    <div class="straightline">
      <h1 class="questionmark">?</h1>
    </div>

    <div class="bottom">
      <div class="left">
        <input id="inputbar" type="text" maxlength="2" />
        <button id="checkbtn">Check!</button>
      </div>

      <div class="right">
        <p id="startguessing">Start guessing.....</p>
        <p >Score: <span class="score">0</span></p>
        <p>Highscore: <span class="highscore">0</span></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
